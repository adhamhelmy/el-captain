sonar.projectKey=el-captain
sonar.projectName=el-captain
sonar.host.url=http://localhost:9000
sonar.sources=apps/web,apps/mobile,packages/types,packages/rules
sonar.exclusions=**/node_modules/**,**/.next/**,**/*.test.ts,**/*.test.tsx,apps/web/test/**,**/prisma/migrations/**,apps/mobile/.expo/**,apps/mobile/dist/**,apps/mobile/coverage/**
sonar.tests=apps/web,apps/mobile
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,apps/web/test/**
sonar.qualitygate.wait=true
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info,apps/mobile/coverage/lcov.info
sonar.coverage.exclusions=apps/mobile/**/*.tsx,apps/mobile/*.js,apps/web/app/(frontend)/**,apps/web/components/**,apps/web/lib/mock.ts,**/*.config.ts,**/*.config.mjs,apps/web/prisma/**,apps/web/proxy.ts,apps/web/app/layout.tsx,apps/web/app/not-found.tsx,apps/web/scripts/**
