sonar.projectKey=el-captain
sonar.projectName=el-captain
sonar.host.url=http://localhost:9000
sonar.sources=apps/web,packages/types
sonar.exclusions=**/node_modules/**,**/.next/**,**/*.test.ts,**/prisma/migrations/**
sonar.tests=apps/web
sonar.test.inclusions=**/*.test.ts
sonar.qualitygate.wait=true
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
# UI pages run on mock data for now; coverage is enforced on lib/ and API routes only.
sonar.coverage.exclusions=apps/web/app/(frontend)/**,apps/web/components/**,apps/web/lib/mock.ts,**/*.config.ts,apps/web/prisma/**,apps/web/proxy.ts
