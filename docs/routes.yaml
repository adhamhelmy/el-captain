- bookings:
    - list (admin):
      get:
        summary: List all bookings for the current user
        responses:
          '200':
            description: List of bookings retrieved successfully
          '401':
            description: User not logged in
    - get (admin, user):
      get:
        summary: Get booking by ID for the current user
        parameters:
          - name: id
            in: path
            required: true
            type: string
        responses:
          '200':
            description: Booking information retrieved successfully
          '404':
            description: Booking not found
          '401':
            description: User not logged in
    - create (user):
      post:
        summary: Create a new booking
        request:
          coach_id:
            type: string
          date:
            type: string
            format: date-time
          duration:
            type: integer
        responses:
          '201':
            description: Booking created successfully
          '400':
            description: Invalid input
          '404':
            description: Coach not found
          '401':
            description: User not logged in  
    - update (user):
      put:
        summary: Update booking information for the current user                    
        parameters:
