- auth:
    - register:
      post:
        summary: Register a new user
        request:
          email: string
          password: string
          type: [admin, coach, user]
    - verify-email:
      post:
        summary: Verify user email
        request:
          token: string
    - resend-verification:
      post:
        summary: Resend email verification
        request:
          email: string
    - login:
      post:
        summary: Login a user
        request:
          email: string
          password: string
    - logout:
      post:
        summary: Logout a user
    - refresh:
      post:
        summary: Refresh authentication token
    - forgot-password:
      post:
        summary: Request password reset
        request:
          email: string
    - reset-password:
      post:
        summary: Reset user password
        request:
          token: string
          new_password: string
    - me:
      get:
        summary: Get current user information
- admin (admin):
    - dashboard:
      get:
        summary: Get admin dashboard information
    - users:
      - list:
          get:
            summary: List all users
      - get:
          get:
            summary: Get user by ID
            parameters:
              - id: string
      - update:
          put:
            summary: Update user information
            parameters:
              - id: string
            request:
              email: string
              password: string
              type: [admin, coach, user]
      - delete:
          delete:
            summary: Delete user by ID
            parameters:
              - id: string
    - coaches:
      - list:
          get:
            summary: List all coaches
      - get:
          get:
            summary: Get coach by ID
            parameters:
              - id: string
      - update:
          put:
            summary: Update coach information
            parameters:
              - id: string
            request:
              email :
                type: string
              password: string
      - delete:
      delete:
        summary: Delete coach by ID
        parameters:
          - id: string
- coach (coach):
    - dashboard:
      get:
        summary: Get coach dashboard information
    - profile:
      get:
        summary: Get coach profile information
      put:
        summary: Update coach profile information
        request:
          email: string
          password: string
    - locations:
      - list:
          get:
            summary: List all locations for the coach
      - get:
          get:
            summary: Get location by ID for the coach
            parameters:
              - id: string
      - create:
          post:
            summary: Create a new location for the coach
            request:
              name: string
              address: string
      - update:
          put:
            summary: Update location information for the coach
            parameters:
              - id: string
            request:
              name: string
              address: string
      - delete:
          delete:
            summary: Delete location by ID for the coach
            parameters:
              - id: string
- user (user):
    - dashboard:
      get:
        summary: Get user dashboard information
    - profile:
      get:
        summary: Get user profile information
      put:
        summary: Update user profile information
        request:
          email :
            type: string
          password: string
- sessions:
    - list:
      get:
        summary: List all sessions
    - get:
      get:
        summary: Get session by ID
        parameters:
          - id: string
    - create (admin, coach):
      post:
        summary: Create a new session
        request:
          title: string
          description: string
          coach_id: string
    - update (admin, coach):
      put:
        summary: Update session information
        parameters:
          - id: string
        request:
          title: string
          description: string
    - delete (admin, coach):
      delete:
        summary: Delete session by ID
        parameters:
          - id: string
    - me (coach, user):
        - list:
          get:
            summary: List sessions for the current user
- coaches:
    - list:
      get:
        summary: List all coaches
    - get:
      get:
        summary: Get coach by ID
        parameters:
          - id: string
    - me (user):
      get:
        summary: Get current user's coach information
    - [id]:
      - favorite (user):
          post:
            summary: Add a coach to user's favorites
            parameters:
              - id: string
      - unfavorite (user):
          delete:
            summary: Remove a coach from user's favorites
            parameters:
              - id: string
- bookings:
    - list (admin):
      get:
        summary: List all bookings for the current user
    - get (admin, user):
      get:
        summary: Get booking by ID for the current user
        parameters:
          - id: string
    - create (user):
      post:
        summary: Create a new booking
        request:
          coach_id: string
          date: date-time
          duration: integer
    - update (user):
      put:
        summary: Update booking information for the current user                    
        parameters:
          - id: string
        request:
          date: date-time
          duration: integer
    - cancel (user):
      delete:
        summary: Cancel a booking by ID
        parameters:
          - id: string
    - accept (coach):
      post:
        summary: Accept a booking by ID
        parameters:
          - id: string
    - reject (coach):
      post:
        summary: Reject a booking by ID
        parameters:
          - id: string
    - me (user, coach):
      - list:
          get:
            summary: List bookings for the current user
- locations:
    - list:
      get:
        summary: List all locations
    - get:
      get:
        summary: Get location by ID
        parameters:
          - id: string
