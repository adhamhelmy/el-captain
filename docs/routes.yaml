            in: path
            required: true
            type: string
        request:
          date:
            type: string
            format: date-time
          duration:
            type: integer
        responses:
          '200':
            description: Booking updated successfully
          '400':
            description: Invalid input
          '404':
            description: Booking not found
          '401':
            description: User not logged in        
    - cancel (user):
