- auth:
    - register:
      post:
        summary: Register a new user
        request:
          email: string
          password: string
          type: [admin, coach, user]
    - verify-email:
      post:
        summary: Verify user email
        request:
          token: string
    - resend-verification:
      post:
        summary: Resend email verification
        request:
          email: string
    - login:
      post:
        summary: Login a user
        request:
          email: string
          password: string
    - logout:
      post:
        summary: Logout a user
    - refresh:
      post:
        summary: Refresh authentication token
    - forgot-password:
      post:
        summary: Request password reset
        request:
          email: string
    - reset-password:
      post:
        summary: Reset user password
        request:
          token: string
          new_password: string
    - me:
      get:
        summary: Get current user information
- admin (admin):
    - dashboard:
      get:
        summary: Get admin dashboard information
    - users:
      - list:
          get:
            summary: List all users
      - get:
          get:
            summary: Get user by ID
            parameters:
              - id: string
      - update:
          put:
            summary: Update user information
            parameters:
              - id: string
            request:
              email: string
              password: string
              type: [admin, coach, user]
      - delete:
          delete:
            summary: Delete user by ID
            parameters:
              - id: string
    - coaches:
      - list:
          get:
            summary: List all coaches
      - get:
          get:
            summary: Get coach by ID
            parameters:
              - id: string
      - update:
          put:
            summary: Update coach information
            parameters:
              - id: string
            request:
              email :
                type: string
              password: string
      - delete:
      delete:
        summary: Delete coach by ID
        parameters:
          - id: string
    - coaches/review:
      - list:
          get:
            summary: Coaches by review status (?status=PENDING is the review queue, oldest first)
      - get:
          get:
            summary: Full coach profile with review history
      - status:
          post:
            summary: Approve, reject (reason required), suspend or reinstate a coach
            request:
              to: string
              reason: string
    - sports:
      - list:
          get:
            summary: All sports with coach counts, pending first
      - create:
          post:
            summary: Add an approved sport
            request:
              nameEn: string
              nameAr: string
      - update:
          patch:
            summary: Rename and/or approve a sport
            request:
              nameEn: string
              nameAr: string
              approve: boolean
      - merge:
          post:
            summary: Merge a sport into another; its coaches move over
            request:
              intoId: string
