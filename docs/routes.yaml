- auth:
    - register:
      post:
        summary: Register a new user
        request:
          email:
            type: string
          password:
            type: string
          type:
            type: string
            enum: [admin, coach, user]
        responses:
          '201':
            description: User registered successfully
          '400':
            description: Invalid input
    - verify-email:
      post:
        summary: Verify user email
        request:
          token:
            type: string
        responses:
          '200':
            description: Email verified successfully
          '400':
            description: Invalid or expired token
    - resend-verification:
      post:
        summary: Resend email verification
        request:
          email:
            type: string
        responses:
          '200':
            description: Verification email resent successfully     
    - login:
      post:
        summary: Login a user
        request:
          email:
            type: string
          password:
            type: string
        responses:
          '200':
            description: User logged in successfully
          '401':
            description: Invalid credentials
    - logout:
      post:
        summary: Logout a user
        responses:
          '200':
            description: User logged out successfully
          '401':
            description: User not logged in
    - refresh:
      post:
        summary: Refresh authentication token
        responses:
          '200':
            description: Token refreshed successfully
          '401':
            description: Invalid or expired token
    - forgot-password:
      post:
        summary: Request password reset
        request:
          email:
            type: string
        responses:
          '200':
            description: Password reset email sent
          '404':
            description: Email not found
    - reset-password:
      post:
        summary: Reset user password
        request:
          token:
            type: string
          new_password:
            type: string
        responses:
          '200':
            description: Password reset successfully
          '400':
            description: Invalid token or password
    - me:
      get:
        summary: Get current user information
        responses:
          '200':
            description: Current user information retrieved successfully
          '401':
            description: User not logged in
- admin (admin):
    - dashboard:
      get:
        summary: Get admin dashboard information
        responses:
          '200':
            description: Admin dashboard information retrieved successfully
          '401':
            description: User not logged in
    - users:
      - list:
          get:
            summary: List all users
            responses:
              '200':
                description: List of users retrieved successfully
              '401':
                description: User not logged in
      - get:
          get:
            summary: Get user by ID
            parameters:
              - name: id
                in: path
                required: true
                type: string
            responses:
              '200':
                description: User information retrieved successfully
              '404':
                description: User not found
              '401':
                description: User not logged in
      - update:
          put:
            summary: Update user information
            parameters:
              - name: id
                in: path
                required: true
                type: string
            request:
              email:
                type: string
              password:
                type: string
              type:
                type: string
                enum: [admin, coach, user]
            responses:
              '200':
                description: User updated successfully
              '400':
                description: Invalid input
              '404':
                description: User not found
              '401':
                description: User not logged in
      - delete:
          delete:
            summary: Delete user by ID
            parameters:
              - name: id
                in: path
                required: true
                type: string
            responses:
              '200':
                description: User deleted successfully
              '404':
                description: User not found
              '401':
                description: User not logged in      
    - coaches:
      - list:
          get:
            summary: List all coaches
            responses:
              '200':
                description: List of coaches retrieved successfully
              '401':
                description: User not logged in
      - get:
          get:
            summary: Get coach by ID
            parameters:
              - name: id
                in: path
                required: true
                type: string
            responses:
              '200':
                description: Coach information retrieved successfully
              '404':
                description: Coach not found
              '401':
                description: User not logged in
      - update:
          put:
            summary: Update coach information
            parameters:
              - name: id
                in: path
                required: true
                type: string
            request:
              email :
                type: string
              password:
                type: string
            responses:
              '200':
                description: Coach updated successfully
              '400':
                description: Invalid input
              '404':
                description: Coach not found
              '401':
                description: User not logged in
      - delete:
      delete:
        summary: Delete coach by ID
        parameters:
          - name: id
            in: path
            required: true
            type: string
        responses:
          '200':
            description: Coach deleted successfully
