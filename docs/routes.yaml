    - list:
      get:
        summary: List all locations
    - get:
      get:
        summary: Get location by ID
        parameters:
          - id: string
- sports:
    - list:
      get:
        summary: Approved sports (plus the signed-in coach's own pending ones), ?q= to search
    - create (coach):
      post:
        summary: Add a sport; hidden from others until an admin approves it; 409 sport_exists returns the match
        request:
          name: string
- uploads (coach):
    post:
      summary: Vercel Blob client-upload token for a coach photo or certificate
