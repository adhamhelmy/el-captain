- bookings:
    - list (admin):
      get:
        summary: List all bookings for the current user
    - get (admin, user):
      get:
        summary: Get booking by ID for the current user
        parameters:
          - id: string
    - create (user):
      post:
        summary: Create a new booking
        request:
          coach_id: string
          date: date-time
          duration: integer
    - update (user):
      put:
        summary: Update booking information for the current user                    
        parameters:
          - id: string
        request:
          date: date-time
          duration: integer
    - cancel (user):
      delete:
        summary: Cancel a booking by ID
        parameters:
          - id: string
    - accept (coach):
      post:
        summary: Accept a booking by ID
        parameters:
          - id: string
    - reject (coach):
      post:
        summary: Reject a booking by ID
        parameters:
          - id: string
    - me (user, coach):
      - list:
          get:
            summary: List bookings for the current user
